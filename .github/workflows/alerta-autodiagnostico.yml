# Revisa cada hora si los autodiagnósticos se dispararon y, si sí, manda correo
# al equipo de CX.
#
# ¿Por qué aquí y no dentro de la app? Porque la app de Streamlit solo se ejecuta
# cuando alguien tiene la página abierta. Si nadie la abre, no habría alerta. Esto
# corre solo en los servidores de GitHub, con la página cerrada.
#
# ANTES DE QUE FUNCIONE hay que crear los "secrets" del repositorio en:
#   GitHub -> el repo -> Settings -> Secrets and variables -> Actions -> New secret
# Obligatorios: REDASH_URL, REDASH_QUERY_ID, REDASH_API_KEY,
#               SMTP_USUARIO, SMTP_CLAVE
# Opcionales:   SMTP_HOST, SMTP_PORT, ALERTA_DESTINATARIOS, ALERTA_URL_APP

name: Alerta de picos de autodiagnóstico

on:
  schedule:
    # CADA 10 MINUTOS, no cada hora. Esto es lo que hace que el aviso sea
    # inmediato, y va de la mano con que alertas.py revise la hora EN CURSO:
    # de nada sirve poder leer una hora a medias si el programa solo se
    # despierta una vez por hora.
    #
    # Con el cron horario, un pico que arrancaba al minuto 5 se avisaba 65
    # minutos después (promedio 44 min, peor caso 74). Cada 10 minutos el
    # promedio baja a ~20 min y el peor caso a ~24.
    #
    # El piso son ~15 minutos y no se puede bajar de ahí desde aquí: es lo que
    # tarda el dato en aparecer en Redash. Por eso no se pone cada 5 minutos,
    # que duplicaría la carga sobre Redash sin ganar casi nada.
    #
    # Los minutos son 3,13,23... y no 0,10,20... a propósito: GitHub retrasa
    # las tareas programadas cuando hay mucha carga, y los minutos redondos
    # (sobre todo el 0) son los más congestionados.
    - cron: "3,13,23,33,43,53 * * * *"
  # Permite lanzarla a mano desde la pestaña Actions, para probar.
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué hacer en esta corrida"
        type: choice
        default: revisar
        options:
          - revisar         # lo normal: mira si hay pico y avisa solo si lo hay
          - probar-envio    # manda un correo de prueba para comprobar el envío
      solo_a:
        description: "Solo para probar-envio: a qué correo enviarlo. Si se deja vacío, va a TODO el equipo."
        required: false
        type: string
      dia:
        description: "Opcional: revisar un día concreto, AAAA-MM-DD. Sirve para reproducir un pico conocido."
        required: false
        type: string
      hora:
        description: "Opcional: revisar una hora concreta, 0 a 23. Va junto con el día."
        required: false
        type: string

# Si una corrida se demora, que la siguiente espere en vez de solaparse.
concurrency:
  group: alerta-autodiagnostico
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    # Una corrida normal tarda ~40 s (instalar + revisar). Antes el tope eran
    # 15 min, que no importaba con un cron horario; ahora que el cron es cada
    # 10 min, una corrida que se cuelga bloquearía varios ciclos seguidos
    # (concurrency.cancel-in-progress es false a propósito, para no cortar un
    # envío a medias). 5 minutos deja margen de sobra y limita el daño.
    timeout-minutes: 5

    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-alertas.txt

      - name: Instalar lo mínimo necesario
        run: pip install -r requirements-alertas.txt

      # Memoria de qué horas ya se avisaron, para no repetir el mismo aviso.
      # Si esta caché no restaura, la alerta NO se pierde: cada corrida repasa
      # la ventana completa de horas recientes, así que en el peor caso repite
      # un aviso en vez de callarlo. Antes no era así, y por eso se perdieron
      # los picos del 28-ago.
      - name: Recuperar el registro de avisos ya enviados
        uses: actions/cache@v4
        with:
          path: .alerta_estado.json
          key: alerta-estado-${{ github.run_id }}
          restore-keys: |
            alerta-estado-

      - name: Revisar la última hora completa y avisar si hay pico
        env:
          REDASH_URL: ${{ secrets.REDASH_URL }}
          REDASH_QUERY_ID: ${{ secrets.REDASH_QUERY_ID }}
          REDASH_API_KEY: ${{ secrets.REDASH_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_CLAVE: ${{ secrets.SMTP_CLAVE }}
          ALERTA_REMITENTE: ${{ secrets.ALERTA_REMITENTE }}
          ALERTA_DESTINATARIOS: ${{ secrets.ALERTA_DESTINATARIOS }}
          ALERTA_URL_APP: ${{ secrets.ALERTA_URL_APP }}
          # Espacio de Google Chat donde publicar el aviso. Es un canal aparte
          # del correo: si uno falla, el otro sigue avisando.
          CHAT_WEBHOOK_URL: ${{ secrets.CHAT_WEBHOOK_URL }}
          # Lo que se eligió al lanzarla a mano. En las corridas programadas
          # llegan vacíos, así que cae en el modo normal.
          # Van por env y no dentro del run para que un texto escrito a mano no
          # pueda inyectar comandos en el script.
          MODO: ${{ inputs.modo }}
          SOLO_A: ${{ inputs.solo_a }}
          DIA: ${{ inputs.dia }}
          HORA: ${{ inputs.hora }}
        run: |
          if [ "$MODO" = "probar-envio" ]; then
            if [ -n "$SOLO_A" ]; then
              python alertas.py --probar-envio --solo-a "$SOLO_A"
            else
              python alertas.py --probar-envio
            fi
            exit $?
          fi

          # Si se pide un día u hora concretos, se revisa solo eso. Sirve para
          # reproducir un pico conocido y ver el aviso de verdad en el canal.
          # Los valores se pasan como argumentos entrecomillados, nunca pegados
          # dentro del comando, para que un texto escrito a mano no pueda
          # inyectar ordenes.
          set --
          [ -n "$DIA" ] && set -- "$@" --dia "$DIA"
          [ -n "$HORA" ] && set -- "$@" --hora "$HORA"
          if [ "$#" -gt 0 ]; then
            python alertas.py "$@" --ignorar-estado
          else
            python alertas.py
          fi
