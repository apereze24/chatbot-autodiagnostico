# Revisa si los autodiagnósticos se dispararon y, si sí, avisa al equipo de CX
# por Google Chat y por correo.
#
# ¿Por qué aquí y no dentro de la app? Porque la app de Streamlit solo se ejecuta
# cuando alguien tiene la página abierta. Si nadie la abre, no habría alerta. Esto
# corre solo en los servidores de GitHub, con la página cerrada.
#
# QUIÉN LA DISPARA (importante, leer antes de tocar el cron):
#   El disparador principal es EXTERNO: un servicio de cron (cron-job.org) llama
#   cada 2 minutos a la API de GitHub para lanzar este workflow
#   (workflow_dispatch). Ver ALERTA-CORREO.md, sección "Disparador".
#
#   El cron de GitHub de abajo NO sirve para esto y se deja solo como respaldo.
#   Se midió: configurado cada 10 minutos, GitHub lo ejecutó 4 a 7 veces AL DÍA
#   (mediana de 262 minutos entre corridas, huecos de hasta 10 horas). Es "best
#   effort" y en repositorios gratuitos lo recorta muchísimo. El 30-oct-2026 eso
#   dejó sin avisar el pico de las 05:00 y avisó el de las 06:00 a las 12:58.
#
# ANTES DE QUE FUNCIONE hay que crear los "secrets" del repositorio en:
#   GitHub -> el repo -> Settings -> Secrets and variables -> Actions -> New secret
# Obligatorios: REDASH_URL, REDASH_QUERY_ID, REDASH_API_KEY (de un usuario que
#               pueda correr consultas en etlhub), CHAT_WEBHOOK_URL y/o
#               SMTP_USUARIO + SMTP_CLAVE, ALERTA_DESTINATARIOS
# Opcionales:   SMTP_HOST, SMTP_PORT, ALERTA_REMITENTE, ALERTA_URL_APP

name: Alerta de picos de autodiagnóstico

on:
  schedule:
    # Solo respaldo (ver arriba): si el disparador externo se cae, esto al
    # menos corre algunas veces al día. No da tiempos de aviso garantizados.
    - cron: "3,13,23,33,43,53 * * * *"
  # El disparador principal (cron-job.org) llega por aquí. También permite
  # lanzarla a mano desde la pestaña Actions, para probar.
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué hacer en esta corrida"
        type: choice
        default: revisar
        options:
          - revisar         # lo normal: mira si hay pico y avisa solo si lo hay
          - probar-envio    # manda un aviso de prueba para comprobar el envío
      solo_a:
        description: "Solo para probar-envio: a qué correo enviarlo. Si se deja vacío, va a TODO el equipo."
        required: false
        type: string
      dia:
        description: "Opcional: revisar un día concreto, AAAA-MM-DD. Sirve para reproducir un pico conocido."
        required: false
        type: string
      hora:
        description: "Opcional: revisar una hora concreta, 0 a 23. Va junto con el día."
        required: false
        type: string

# Una corrida a la vez. Si llega otra mientras una está en curso, espera.
# No se cancela la que está corriendo para no cortar un envío a medias.
concurrency:
  group: alerta-autodiagnostico
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    # Una corrida normal tarda ~30 s. Con el disparador cada 2 min, una que se
    # cuelga bloquearía los ciclos siguientes; 4 minutos limita el daño.
    timeout-minutes: 4

    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-alertas.txt

      - name: Instalar lo mínimo necesario
        run: pip install -r requirements-alertas.txt

      # Memoria de qué horas ya se avisaron, para no repetir el mismo aviso.
      # Si no restaura, la alerta NO se pierde: cada corrida repasa la ventana
      # completa de horas recientes, así que en el peor caso repite un aviso en
      # vez de callarlo.
      - name: Recuperar el registro de avisos ya enviados
        uses: actions/cache/restore@v4
        with:
          path: .alerta_estado.json
          key: alerta-estado-${{ github.run_id }}
          restore-keys: |
            alerta-estado-

      - name: Anotar cómo estaba la memoria
        id: antes
        run: echo "huella=$(sha256sum .alerta_estado.json 2>/dev/null | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - name: Revisar y avisar si hay pico
        env:
          REDASH_URL: ${{ secrets.REDASH_URL }}
          REDASH_QUERY_ID: ${{ secrets.REDASH_QUERY_ID }}
          REDASH_API_KEY: ${{ secrets.REDASH_API_KEY }}
          # Fuente de Redash donde viven las tablas en vivo (etlhub). No es
          # secreto: es un número de catálogo, no da acceso por sí solo.
          REDASH_DATA_SOURCE_ID: "4"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_CLAVE: ${{ secrets.SMTP_CLAVE }}
          ALERTA_REMITENTE: ${{ secrets.ALERTA_REMITENTE }}
          ALERTA_DESTINATARIOS: ${{ secrets.ALERTA_DESTINATARIOS }}
          ALERTA_URL_APP: ${{ secrets.ALERTA_URL_APP }}
          # Espacio de Google Chat donde publicar el aviso. Es un canal aparte
          # del correo: si uno falla, el otro sigue avisando.
          CHAT_WEBHOOK_URL: ${{ secrets.CHAT_WEBHOOK_URL }}
          # Lo que se eligió al lanzarla a mano. En las corridas automáticas
          # llegan vacíos, así que cae en el modo normal.
          # Van por env y no dentro del run para que un texto escrito a mano no
          # pueda inyectar comandos en el script.
          MODO: ${{ inputs.modo }}
          SOLO_A: ${{ inputs.solo_a }}
          DIA: ${{ inputs.dia }}
          HORA: ${{ inputs.hora }}
        run: |
          if [ "$MODO" = "probar-envio" ]; then
            if [ -n "$SOLO_A" ]; then
              python alertas.py --probar-envio --solo-a "$SOLO_A"
            else
              python alertas.py --probar-envio
            fi
            exit $?
          fi

          # Si se pide un día u hora concretos, se revisa solo eso. Sirve para
          # reproducir un pico conocido y ver el aviso de verdad en el canal.
          # Los valores se pasan como argumentos entrecomillados, nunca pegados
          # dentro del comando, para que un texto escrito a mano no pueda
          # inyectar ordenes.
          set --
          [ -n "$DIA" ] && set -- "$@" --dia "$DIA"
          [ -n "$HORA" ] && set -- "$@" --hora "$HORA"
          if [ "$#" -gt 0 ]; then
            python alertas.py "$@" --ignorar-estado
          else
            python alertas.py
          fi

      # Solo se guarda si la memoria cambió (es decir, si salió un aviso). Con
      # corridas cada 2 minutos, guardarla siempre crearía ~720 copias al día.
      # Va con always() para no perder un aviso ya enviado aunque otro canal
      # haya fallado en la misma corrida.
      - name: Ver si la memoria cambió
        id: despues
        if: always()
        run: echo "huella=$(sha256sum .alerta_estado.json 2>/dev/null | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - name: Guardar el registro de avisos
        if: always() && steps.despues.outputs.huella != '' && steps.despues.outputs.huella != steps.antes.outputs.huella
        uses: actions/cache/save@v4
        with:
          path: .alerta_estado.json
          key: alerta-estado-${{ github.run_id }}
